<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Ads Meta Tags -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7557276605338517"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-7557276605338517" />

    <!-- Required Meta Tags -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://globetrekker.site" />

    <!-- SEO Meta Tags -->
    <title>Globe Trekker - Explore the World with Us</title>
    <meta
      name="description"
      content="globe trekker is your trusted travel companion. Discover destinations, plan trips, and read travel tales from around the world."
    />
    <meta
      name="keywords"
      content="globe trekker, travel, travel blog, travel website, explore, trip planning"
    />
    <meta name="author" content="globe trekker Team" />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="globe trekker - Explore the World with Us"
    />
    <meta
      property="og:description"
      content="Discover your next adventure with TripTales. Plan, explore, and share unforgettable travel experiences."
    />
    <meta property="og:image" content="logo.jpeg" />
    <meta property="og:url" content="https://globetrekker.site" />
    <meta property="og:type" content="website" />

    <!-- Twitter Meta -->
    <meta name="twitter:card" content="logo.jpeg" />
    <meta name="twitter:title" content="globe trekker - Explore the World" />
    <meta
      name="twitter:description"
      content="Plan your next adventure with globe trekker - your ultimate travel guide."
    />
    <meta name="twitter:image" content="logo.jpeg" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="logo.jpeg" />

    <!-- Favicon -->
    <link rel="icon" href="logo.jpeg" />

    <!-- Structured Data: JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "globetrekker",
        "url": "https://globetrekker.site",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://globetrekker.site/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
